[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-spg-lcda"
version = "0.1.0"
description = "Single-class industrial 2D Sim2Real domain adaptation experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pyyaml>=6.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "ultralytics>=8.3",
  "open-clip-torch>=2.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

